name: Validate figure skills

on:
  push:
    paths-ignore:
      - 'references/catalog-*.json'
      - 'references/catalog-latest.md'
      - 'references/dsh-compatibility.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate packaged skills and gallery
        run: python scripts/validate_repo.py
      - name: Test installation, provenance, editability and existing tools
        run: python -m unittest discover -s tests -v
      - name: Check optional authoring helper syntax
        run: |
          node --check scripts/handcrafted.mjs
          node --check assets/examples/handcrafted-usage.mjs
