name: daily catalog and DSH sync

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh GitHub metadata and discoveries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_catalog.py
          python scripts/sync_dsh.py
      - name: Validate repository
        run: |
          python scripts/validate_repo.py
          python -m unittest discover -s tests -v
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/catalog-snapshot.json references/catalog-latest.md references/dsh-compatibility.json
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git commit -m "chore: refresh catalog and DSH compatibility"
          git push
