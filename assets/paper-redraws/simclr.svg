<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">SimCLR framework</title><desc id="svg-desc">Editable reconstruction of Chen et al. (2020), Figure 2.</desc><metadata>Source-faithful redraw; source paper Figure 2; all views and operations are native vectors.</metadata>
  <defs>
    <marker id="paper-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <marker id="paper-arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#777"/></marker>
    <style>
    .sans{font-family:Arial,Helvetica,sans-serif;fill:#111}.serif{font-family:'Times New Roman',Times,serif;fill:#111}
    .t9{font-size:9px}.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t14{font-size:14px}.t16{font-size:16px}
    .bold{font-weight:700}.italic{font-style:italic}.thin{fill:none;stroke:#111;stroke-width:1}.mid{fill:none;stroke:#111;stroke-width:1.5}
    .thick{fill:none;stroke:#111;stroke-width:2}.gray{fill:#d7d7d7;stroke:#333;stroke-width:1}.light{fill:#f5f5f5;stroke:#111;stroke-width:1}
    .blue{fill:#dbe9f6;stroke:#386a98;stroke-width:1}.green{fill:#dcebc8;stroke:#4e7a35;stroke-width:1}.yellow{fill:#f4e7a7;stroke:#826f24;stroke-width:1}
    .orange{fill:#f4d0a3;stroke:#925c22;stroke-width:1}.pink{fill:#f2cdd0;stroke:#9b4b52;stroke-width:1}.violet{fill:#ddd4ed;stroke:#665283;stroke-width:1}
    .cyan-stroke{fill:none;stroke:#42a3b8;stroke-width:1.5}.green-stroke{fill:none;stroke:#5a9e55;stroke-width:1.5}.black-dash{fill:none;stroke:#111;stroke-width:1.5;stroke-dasharray:3 3}
    </style>
  </defs>
  <rect width="640" height="270" fill="#fff"/>
  <g id="input-x" >
<circle cx="320" cy="240" r="23" fill="#eee" stroke="#111" stroke-width="1.2"/>
<text x="320" y="245" class="serif t13 italic" text-anchor="middle">x</text>
</g><g id="view-xi" >
<circle cx="190" cy="182" r="23" fill="#eee" stroke="#111" stroke-width="1.2"/>
<text x="190" y="187" class="serif t13 italic" text-anchor="middle">x̃ᵢ</text>
</g><g id="view-xj" >
<circle cx="450" cy="182" r="23" fill="#eee" stroke="#111" stroke-width="1.2"/>
<text x="450" y="187" class="serif t13 italic" text-anchor="middle">x̃ⱼ</text>
</g><g id="repr-hi" >
<circle cx="190" cy="111" r="23" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="190" y="116" class="serif t13 italic" text-anchor="middle">hᵢ</text>
</g><g id="repr-hj" >
<circle cx="450" cy="111" r="23" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="450" y="116" class="serif t13 italic" text-anchor="middle">hⱼ</text>
</g><g id="proj-zi" >
<circle cx="190" cy="42" r="23" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="190" y="47" class="serif t13 italic" text-anchor="middle">zᵢ</text>
</g><g id="proj-zj" >
<circle cx="450" cy="42" r="23" fill="#fff" stroke="#111" stroke-width="1.2"/>
<text x="450" y="47" class="serif t13 italic" text-anchor="middle">zⱼ</text>
</g><g id="augmentation-edges" >
<path d="M303 225 C268 204 242 190 214 184" class="mid" marker-end="url(#paper-arrow)"/>
<path d="M337 225 C372 204 398 190 426 184" class="mid" marker-end="url(#paper-arrow)"/>
<text x="250" y="219" class="serif t12 italic">t ~ T</text><text x="390" y="219" class="serif t12 italic">t′ ~ T</text>
</g><g id="encoder-edges" >
<line x1="190" y1="159" x2="190" y2="135" class="mid" marker-end="url(#paper-arrow)"/>
<line x1="450" y1="159" x2="450" y2="135" class="mid" marker-end="url(#paper-arrow)"/>
<text x="168" y="151" class="serif t12 italic">f(·)</text><text x="428" y="151" class="serif t12 italic">f(·)</text>
</g><g id="projection-edges" >
<line x1="190" y1="87" x2="190" y2="66" class="mid" marker-end="url(#paper-arrow)"/>
<line x1="450" y1="87" x2="450" y2="66" class="mid" marker-end="url(#paper-arrow)"/>
<text x="164" y="81" class="serif t12 italic">g(·)</text><text x="424" y="81" class="serif t12 italic">g(·)</text>
</g><g id="objectives" >
<line x1="216" y1="42" x2="424" y2="42" class="thin" marker-start="url(#paper-arrow)" marker-end="url(#paper-arrow)"/>
<text x="320" y="29" class="serif t12" text-anchor="middle">Maximize agreement</text>
<line x1="216" y1="111" x2="424" y2="111" class="thin" marker-start="url(#paper-arrow)" marker-end="url(#paper-arrow)"/>
<text x="320" y="101" class="serif t12" text-anchor="middle">Representation</text>
</g>
</svg>
