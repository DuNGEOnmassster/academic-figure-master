<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="180" viewBox="0 0 340 180" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Residual learning building block</title><desc id="svg-desc">Editable reconstruction of He et al. (2015), Figure 2.</desc><metadata>Source-faithful redraw; source paper Figure 2.</metadata>
