<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Convolutional feature pyramid</title><desc id="svg-desc">Progressive spatial compression and channel expansion</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34445f"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3972d5"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7354cf"/></marker>
    <linearGradient id="soft-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#f1edff"/></linearGradient>
    <style>
    .bg{fill:#fbfcff}.title{font:700 30px Inter,Arial,sans-serif;fill:#17233b}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#66758f}
    .label{font:500 19px Inter,Arial,sans-serif;fill:#263550}.strong{font-weight:700}.small{font:500 15px Inter,Arial,sans-serif}.tiny{font:500 13px Inter,Arial,sans-serif}.muted{fill:#66758f}
    .card{stroke-width:2.5}.blue{fill:#eaf2ff;stroke:#3972d5}.violet{fill:#f1edff;stroke:#7354cf}.red{fill:#fff0f0;stroke:#dc5963}.gold{fill:#fff7e6;stroke:#d3a23f}.green{fill:#eaf8f2;stroke:#38a479}.slate{fill:#f2f5f9;stroke:#72819a}.cyan{fill:#e9f9fb;stroke:#2b9aa5}
    .wire{fill:none;stroke:#34445f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.wire2{fill:none;stroke:#3972d5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.violet-line{fill:none;stroke:#7354cf;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.red-line{fill:none;stroke:#dc5963;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.green-line{fill:none;stroke:#38a479;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 9}
    .axis{fill:none;stroke:#8b98ac;stroke-width:2}.grid{stroke:#dce3ed;stroke-width:1.5}.node{fill:#fff;stroke:#34445f;stroke-width:3}.dot-blue{fill:#3972d5}.dot-violet{fill:#7354cf}.dot-red{fill:#dc5963}.dot-green{fill:#38a479}.paper-note{font:600 12px Inter,Arial,sans-serif;fill:#7354cf;letter-spacing:.06em}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <g id="figure-body" transform="translate(0,-65)"><g id="feature-stage-0" >
<rect x="88" y="207" width="190" height="235" rx="12" class="card blue" opacity="0.82"/>
<rect x="79" y="216" width="190" height="235" rx="12" class="card blue" opacity="0.91"/>
<rect x="70" y="225" width="190" height="235" rx="12" class="card blue" opacity="1.00"/>
<text x="165" y="348.5" class="label strong" text-anchor="middle" >Input</text>
</g><text x="165" y="496" class="small muted" text-anchor="middle" >224 × 224 × 3</text><g id="feature-stage-1" >
<rect x="348" y="232" width="155" height="185" rx="12" class="card cyan" opacity="0.82"/>
<rect x="339" y="241" width="155" height="185" rx="12" class="card cyan" opacity="0.91"/>
<rect x="330" y="250" width="155" height="185" rx="12" class="card cyan" opacity="1.00"/>
<text x="407.5" y="348.5" class="label strong" text-anchor="middle" >Conv</text>
</g><text x="407.5" y="471" class="small muted" text-anchor="middle" >112 × 112 × 64</text><g id="stage-arrow-1" >
<line x1="288" y1="342.5" x2="320" y2="342.5" class="wire" marker-end="url(#arrow)"/>
</g><g id="feature-stage-2" >
<rect x="573" y="257" width="125" height="135" rx="12" class="card violet" opacity="0.82"/>
<rect x="564" y="266" width="125" height="135" rx="12" class="card violet" opacity="0.91"/>
<rect x="555" y="275" width="125" height="135" rx="12" class="card violet" opacity="1.00"/>
<text x="617.5" y="348.5" class="label strong" text-anchor="middle" >Conv</text>
</g><text x="617.5" y="446" class="small muted" text-anchor="middle" >56 × 56 × 128</text><g id="stage-arrow-2" >
<line x1="513" y1="342.5" x2="545" y2="342.5" class="wire" marker-end="url(#arrow)"/>
</g><g id="feature-stage-3" >
<rect x="768" y="277" width="100" height="95" rx="12" class="card red" opacity="0.82"/>
<rect x="759" y="286" width="100" height="95" rx="12" class="card red" opacity="0.91"/>
<rect x="750" y="295" width="100" height="95" rx="12" class="card red" opacity="1.00"/>
<text x="800" y="348.5" class="label strong" text-anchor="middle" >Conv</text>
</g><text x="800" y="426" class="small muted" text-anchor="middle" >28 × 28 × 256</text><g id="stage-arrow-3" >
<line x1="708" y1="342.5" x2="740" y2="342.5" class="wire" marker-end="url(#arrow)"/>
</g><g id="feature-stage-4" >
<rect x="930" y="310" width="145" height="65" rx="12" class="card gold" opacity="1.00"/>
<text x="1002.5" y="348.5" class="label strong" text-anchor="middle" >Pool</text>
</g><text x="1002.5" y="411" class="small muted" text-anchor="middle" >1 × 1 × 256</text><g id="stage-arrow-4" >
<line x1="878" y1="342.5" x2="920" y2="342.5" class="wire" marker-end="url(#arrow)"/>
</g></g>
</svg>
