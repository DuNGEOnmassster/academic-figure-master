<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Dataset preparation pipeline</title><desc id="svg-desc">Quality gates, transforms, splits, and versioning</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34445f"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3972d5"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7354cf"/></marker>
    <linearGradient id="soft-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#f1edff"/></linearGradient>
    <style>
    .bg{fill:#fbfcff}.title{font:700 30px Inter,Arial,sans-serif;fill:#17233b}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#66758f}
    .label{font:500 19px Inter,Arial,sans-serif;fill:#263550}.strong{font-weight:700}.small{font:500 15px Inter,Arial,sans-serif}.tiny{font:500 13px Inter,Arial,sans-serif}.muted{fill:#66758f}
    .card{stroke-width:2.5}.blue{fill:#eaf2ff;stroke:#3972d5}.violet{fill:#f1edff;stroke:#7354cf}.red{fill:#fff0f0;stroke:#dc5963}.gold{fill:#fff7e6;stroke:#d3a23f}.green{fill:#eaf8f2;stroke:#38a479}.slate{fill:#f2f5f9;stroke:#72819a}.cyan{fill:#e9f9fb;stroke:#2b9aa5}
    .wire{fill:none;stroke:#34445f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.wire2{fill:none;stroke:#3972d5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.violet-line{fill:none;stroke:#7354cf;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.red-line{fill:none;stroke:#dc5963;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.green-line{fill:none;stroke:#38a479;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 9}
    .axis{fill:none;stroke:#8b98ac;stroke-width:2}.grid{stroke:#dce3ed;stroke-width:1.5}.node{fill:#fff;stroke:#34445f;stroke-width:3}.dot-blue{fill:#3972d5}.dot-violet{fill:#7354cf}.dot-red{fill:#dc5963}.dot-green{fill:#38a479}.paper-note{font:600 12px Inter,Arial,sans-serif;fill:#7354cf;letter-spacing:.06em}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <g id="figure-body" transform="translate(0,-65)"><g id="pipeline-stage-0" >
<rect x="55" y="260" width="170" height="115" rx="18" class="card slate"/>
<text x="140" y="310.5" class="label strong" text-anchor="middle" >Raw data</text>
<text x="140" y="338.5" class="small muted" text-anchor="middle" >files + records</text>
</g><g id="pipeline-stage-1" >
<rect x="285" y="260" width="170" height="115" rx="18" class="card blue"/>
<text x="370" y="310.5" class="label strong" text-anchor="middle" >Validate</text>
<text x="370" y="338.5" class="small muted" text-anchor="middle" >schema + leakage</text>
</g><g id="pipeline-arrow-1" >
<line x1="225" y1="318" x2="285" y2="318" class="wire" marker-end="url(#arrow)"/>
</g><g id="pipeline-stage-2" >
<rect x="515" y="260" width="170" height="115" rx="18" class="card violet"/>
<text x="600" y="310.5" class="label strong" text-anchor="middle" >Transform</text>
<text x="600" y="338.5" class="small muted" text-anchor="middle" >clean + augment</text>
</g><g id="pipeline-arrow-2" >
<line x1="455" y1="318" x2="515" y2="318" class="wire" marker-end="url(#arrow)"/>
</g><g id="pipeline-stage-3" >
<rect x="745" y="260" width="170" height="115" rx="18" class="card gold"/>
<text x="830" y="310.5" class="label strong" text-anchor="middle" >Split</text>
<text x="830" y="338.5" class="small muted" text-anchor="middle" >train / val / test</text>
</g><g id="pipeline-arrow-3" >
<line x1="685" y1="318" x2="745" y2="318" class="wire" marker-end="url(#arrow)"/>
</g><g id="pipeline-stage-4" >
<rect x="975" y="260" width="170" height="115" rx="18" class="card green"/>
<text x="1060" y="310.5" class="label strong" text-anchor="middle" >Version</text>
<text x="1060" y="338.5" class="small muted" text-anchor="middle" >manifest + hash</text>
</g><g id="pipeline-arrow-4" >
<line x1="915" y1="318" x2="975" y2="318" class="wire" marker-end="url(#arrow)"/>
</g><path d="M600,375 L600,495 L370,495" class="red-line dash" marker-end="url(#arrow)"/><text x="485" y="525" class="small muted" text-anchor="middle" >failed checks return to transform</text></g>
</svg>
