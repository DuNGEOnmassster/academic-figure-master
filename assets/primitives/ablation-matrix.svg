<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Ablation matrix</title><desc id="svg-desc">Editable experiment variants and metric deltas</desc>
  <defs>
