<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Model ensemble</title><desc id="svg-desc">Parallel predictors, aggregation, and calibrated output</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34445f"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3972d5"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7354cf"/></marker>
    <linearGradient id="soft-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#f1edff"/></linearGradient>
    <style>
    .bg{fill:#fbfcff}.title{font:700 30px Inter,Arial,sans-serif;fill:#17233b}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#66758f}
    .label{font:500 19px Inter,Arial,sans-serif;fill:#263550}.strong{font-weight:700}.small{font:500 15px Inter,Arial,sans-serif}.tiny{font:500 13px Inter,Arial,sans-serif}.muted{fill:#66758f}
    .card{stroke-width:2.5}.blue{fill:#eaf2ff;stroke:#3972d5}.violet{fill:#f1edff;stroke:#7354cf}.red{fill:#fff0f0;stroke:#dc5963}.gold{fill:#fff7e6;stroke:#d3a23f}.green{fill:#eaf8f2;stroke:#38a479}.slate{fill:#f2f5f9;stroke:#72819a}.cyan{fill:#e9f9fb;stroke:#2b9aa5}
    .wire{fill:none;stroke:#34445f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.wire2{fill:none;stroke:#3972d5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.violet-line{fill:none;stroke:#7354cf;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.red-line{fill:none;stroke:#dc5963;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.green-line{fill:none;stroke:#38a479;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 9}
    .axis{fill:none;stroke:#8b98ac;stroke-width:2}.grid{stroke:#dce3ed;stroke-width:1.5}.node{fill:#fff;stroke:#34445f;stroke-width:3}.dot-blue{fill:#3972d5}.dot-violet{fill:#7354cf}.dot-red{fill:#dc5963}.dot-green{fill:#38a479}.paper-note{font:600 12px Inter,Arial,sans-serif;fill:#7354cf;letter-spacing:.06em}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <g id="figure-body" transform="translate(0,-65)"><g id="input" >
<rect x="55" y="275" width="150" height="100" rx="18" class="card slate"/>
<text x="130" y="318" class="label strong" text-anchor="middle" >Input</text>
<text x="130" y="346" class="small muted" text-anchor="middle" >x</text>
</g><g id="model-1" >
<rect x="325" y="165" width="190" height="90" rx="18" class="card blue"/>
<text x="420" y="203" class="label strong" text-anchor="middle" >Model 1</text>
<text x="420" y="231" class="small muted" text-anchor="middle" >p1(y|x)</text>
</g><g id="input-model-1" >
<path d="M205,325 Q265,236.25 325,210" class="wire" marker-end="url(#arrow)"/>
</g><g id="model-2" >
<rect x="325" y="290" width="190" height="90" rx="18" class="card violet"/>
<text x="420" y="328" class="label strong" text-anchor="middle" >Model 2</text>
<text x="420" y="356" class="small muted" text-anchor="middle" >p2(y|x)</text>
</g><g id="input-model-2" >
<line x1="205" y1="325" x2="325" y2="335" class="wire" marker-end="url(#arrow)"/>
</g><g id="model-3" >
<rect x="325" y="415" width="190" height="90" rx="18" class="card green"/>
<text x="420" y="453" class="label strong" text-anchor="middle" >Model 3</text>
<text x="420" y="481" class="small muted" text-anchor="middle" >p3(y|x)</text>
</g><g id="input-model-3" >
<path d="M205,325 Q265,423.75 325,460" class="wire" marker-end="url(#arrow)"/>
</g><g id="aggregator" >
<rect x="675" y="255" width="190" height="140" rx="18" class="card gold"/>
<text x="770" y="318" class="label strong" text-anchor="middle" >Aggregate</text>
<text x="770" y="346" class="small muted" text-anchor="middle" >mean / vote / stack</text>
</g><g id="model-aggregate-1" >
<path d="M515,210 Q595,298.75 675,325" class="wire" marker-end="url(#arrow)"/>
</g><g id="model-aggregate-2" >
<line x1="515" y1="335" x2="675" y2="325" class="wire" marker-end="url(#arrow)"/>
</g><g id="model-aggregate-3" >
<path d="M515,460 Q595,361.25 675,325" class="wire" marker-end="url(#arrow)"/>
</g><g id="aggregate-output" >
<line x1="865" y1="325" x2="980" y2="325" class="wire" marker-end="url(#arrow)"/>
</g><g id="prediction" >
<rect x="980" y="275" width="165" height="100" rx="18" class="card red"/>
<text x="1062.5" y="318" class="label strong" text-anchor="middle" >Prediction</text>
<text x="1062.5" y="346" class="small muted" text-anchor="middle" >ŷ + uncertainty</text>
</g></g>
</svg>
