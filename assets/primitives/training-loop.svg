<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Training and evaluation loop</title><desc id="svg-desc">Forward pass, loss, gradients, update, and validation</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#34445f"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3972d5"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7354cf"/></marker>
    <linearGradient id="soft-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#f1edff"/></linearGradient>
    <style>
    .bg{fill:#fbfcff}.title{font:700 30px Inter,Arial,sans-serif;fill:#17233b}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#66758f}
    .label{font:500 19px Inter,Arial,sans-serif;fill:#263550}.strong{font-weight:700}.small{font:500 15px Inter,Arial,sans-serif}.tiny{font:500 13px Inter,Arial,sans-serif}.muted{fill:#66758f}
    .card{stroke-width:2.5}.blue{fill:#eaf2ff;stroke:#3972d5}.violet{fill:#f1edff;stroke:#7354cf}.red{fill:#fff0f0;stroke:#dc5963}.gold{fill:#fff7e6;stroke:#d3a23f}.green{fill:#eaf8f2;stroke:#38a479}.slate{fill:#f2f5f9;stroke:#72819a}.cyan{fill:#e9f9fb;stroke:#2b9aa5}
    .wire{fill:none;stroke:#34445f;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.wire2{fill:none;stroke:#3972d5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.violet-line{fill:none;stroke:#7354cf;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.red-line{fill:none;stroke:#dc5963;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.green-line{fill:none;stroke:#38a479;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 9}
    .axis{fill:none;stroke:#8b98ac;stroke-width:2}.grid{stroke:#dce3ed;stroke-width:1.5}.node{fill:#fff;stroke:#34445f;stroke-width:3}.dot-blue{fill:#3972d5}.dot-violet{fill:#7354cf}.dot-red{fill:#dc5963}.dot-green{fill:#38a479}.paper-note{font:600 12px Inter,Arial,sans-serif;fill:#7354cf;letter-spacing:.06em}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <g id="figure-title"><text x="52" y="58" class="title" text-anchor="start" >Training and evaluation loop</text><text x="52" y="86" class="subtitle" text-anchor="start" >Forward pass, loss, gradients, update, and validation</text></g>
  <g id="loop-node-0" >
<rect x="110" y="280" width="160" height="100" rx="18" class="card blue"/>
<text x="190" y="323" class="label strong" text-anchor="middle" >Batch</text>
<text x="190" y="351" class="small muted" text-anchor="middle" >x, y</text>
</g><g id="loop-node-1" >
<rect x="350" y="140" width="160" height="100" rx="18" class="card violet"/>
<text x="430" y="183" class="label strong" text-anchor="middle" >Forward</text>
<text x="430" y="211" class="small muted" text-anchor="middle" >ŷ = fθ(x)</text>
</g><g id="loop-node-2" >
<rect x="630" y="140" width="160" height="100" rx="18" class="card red"/>
<text x="710" y="183" class="label strong" text-anchor="middle" >Loss</text>
<text x="710" y="211" class="small muted" text-anchor="middle" >L(ŷ, y)</text>
</g><g id="loop-node-3" >
<rect x="850" y="280" width="160" height="100" rx="18" class="card gold"/>
<text x="930" y="323" class="label strong" text-anchor="middle" >Backward</text>
<text x="930" y="351" class="small muted" text-anchor="middle" >∇θL</text>
</g><g id="loop-node-4" >
<rect x="630" y="420" width="160" height="100" rx="18" class="card green"/>
<text x="710" y="463" class="label strong" text-anchor="middle" >Update</text>
<text x="710" y="491" class="small muted" text-anchor="middle" >θ ← θ − ηg</text>
</g><g id="loop-node-5" >
<rect x="350" y="420" width="160" height="100" rx="18" class="card cyan"/>
<text x="430" y="463" class="label strong" text-anchor="middle" >Evaluate</text>
<text x="430" y="491" class="small muted" text-anchor="middle" >metrics</text>
</g><g id="loop-edge-0" >
<path d="M245,330 Q310,235 375,190" class="wire" marker-end="url(#arrow)"/>
</g><g id="loop-edge-1" >
<path d="M485,190 Q570,165 655,190" class="wire" marker-end="url(#arrow)"/>
</g><g id="loop-edge-2" >
<path d="M765,190 Q820,235 875,330" class="wire" marker-end="url(#arrow)"/>
</g><g id="loop-edge-3" >
<path d="M875,330 Q820,425 765,470" class="wire" marker-end="url(#arrow)"/>
</g><g id="loop-edge-4" >
<path d="M655,470 Q570,495 485,470" class="wire" marker-end="url(#arrow)"/>
</g><g id="loop-edge-5" >
<path d="M375,470 Q310,425 245,330" class="wire" marker-end="url(#arrow)"/>
</g><text x="600" y="338" class="label strong" text-anchor="middle" >repeat until convergence</text>
</svg>
